services:
 db:
  image: mysql:8.4
  environment:
   MYSQL_DATABASE: storemate
   MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
   MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
   MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
  volumes: ["mysql-data:/var/lib/mysql"]
  healthcheck:
   test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
   interval: 10s
   timeout: 5s
   retries: 12
 backend:
  build: .
  env_file: .env
  depends_on:
   db: {condition: service_healthy}
  restart: unless-stopped
  expose: ["8080"]
 proxy:
  image: caddy:2
  environment:
   API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
  ports: ["80:80", "443:443"]
  volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
  depends_on: [backend]
  restart: unless-stopped
volumes:
 mysql-data:
 caddy-data:
 caddy-config:
