spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/smartstore
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update

#개발용: 직원 매장 참여 요청을 사장님 승인 없이 바로 승인한다 (승인 화면 구현 후 false로)
storemate.dev.auto-approve=true

#개발용: QR·바코드 값을 가리지 않는다. 출근은 어떤 값이든 통과하고, 없는 초대 코드는 가장 최근에 만든 매장으로 보고, 바코드는 형식 검사를 건너뛴다 (규격이 정해지면 false로)
storemate.dev.any-qr=true

#개발용: 새 매장을 만들 때 샘플 상품 6개를 넣는다
storemate.dev.seed-products=true
