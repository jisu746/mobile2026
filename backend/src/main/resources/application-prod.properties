spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=8080
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
storemate.dev.any-qr=false
storemate.dev.auto-approve=false
storemate.push.enabled=${PUSH_ENABLED:false}
storemate.push.access-token=${EXPO_ACCESS_TOKEN:}
storemate.ocr.google-api-key=${GOOGLE_VISION_API_KEY:}
storemate.timezone=Asia/Seoul
